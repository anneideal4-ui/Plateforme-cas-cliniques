{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h1 class="form-title">Creer un compte</h1>
    <p class="form-subtitle">Rejoignez la plateforme de cas cliniques de l'EISMV.</p>

    <form method="post" action="{{ url_for('register') }}" data-validate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <div class="form-row">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" required autocomplete="family-name">
        </div>
        <div class="form-group">
          <label for="prenom">Prenom</label>
          <input type="text" id="prenom" name="prenom" required autocomplete="given-name">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="mot_de_passe">Mot de passe</label>
          <input type="password" id="mot_de_passe" name="mot_de_passe" required minlength="6" autocomplete="new-password">
          <small class="hint">6 caracteres minimum.</small>
        </div>
        <div class="form-group">
          <label for="confirmation">Confirmation</label>
          <input type="password" id="confirmation" name="confirmation" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
    </form>

    <p class="form-footer">Deja inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></p>
  </div>
</div>
{% endblock %}

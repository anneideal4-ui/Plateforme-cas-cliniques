{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="form-card">
    <h1 class="form-title">Connexion</h1>
    <p class="form-subtitle">Accedez a votre espace de travail.</p>

    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus>
      </div>

      <div class="form-group">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>

    <p class="form-footer">Pas encore inscrit ? <a href="{{ url_for('register') }}">Creer un compte</a></p>
  </div>
</div>
{% endblock %}
